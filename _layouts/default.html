<!DOCTYPE html>
<html lang="{{ site.lang | default: "pt-BR" }}">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8">
    <title>{{ page.title }}</title>
    <link rel="stylesheet" href="{{ "/assets/css/main.css" | relative_url }}">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    
    <!-- Cloudflare Web Analytics -->
    <script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "8e4fbc823b3c43678d55472287d6bfba"}'></script>
    <!-- End Cloudflare Web Analytics -->
  </head>
  <body>
    <div class="nav">
      <span><a href="/">Blog</a></span> •
      <span><a href="/quadroclinico">Medicina</a></span> •
      <span><a href="/sobre">Sobre</a></span>
    </div>
    <h1>{{ page.title }}</h1>

    {% if page.date %}
      <i class="post-date">Publicado em {{ page.date | date: "%d/%m/%Y" }}</i>
      <br>
      <br>
    {% endif %}

    {{ content }}

      <script src="https://utteranc.es/client.js"
        repo="filipemosca/moxknet.github.io"
        issue-term="pathname"
        label="comentario"
        theme="github-light"
        crossorigin="anonymous"
        async>
      </script>

    <br/>
    <hr/>
    <span xmlns:cc="http://creativecommons.org/ns#" xmlns:dct="http://purl.org/dc/terms/">mosca.net.br &copy; 2025-2999
    <a href="https://creativecommons.org/licenses/by-sa/4.0/?ref=chooser-v1" target="_blank"
    rel="license noopener noreferrer" style="display:inline-block;">CC BY-SA 4.0</a></span><br />
    </span>
  </body>
</html>
