backend:
  name: github
  repo: filipemosca/mosca.github.io
  branch: main
  base_url: https://sveltia-cms-auth.moxk.workers.dev
site_url: https://mosca.net.br
display_url: https://mosca.net.br
locale: pt
local_backup: true
media_folder: assets/img
public_folder: /assets/img
collections:
- name: posts
  label: Posts do blog
  label_singular: post
  folder: _posts
  extension: md
  format: frontmatter
  create: true
  slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
  summary: '{{title}}'
  fields:
  - {label: Título, name: title, widget: string}
  - {label: Tags, name: tags, widget: list, required: false}
  - {label: Texto, name: body, widget: markdown}
- name: qc_cardio
  label: Quadro Clínico · Cardio
  label_singular: post
  folder: medicina/_posts/cardio
  extension: md
  format: frontmatter
  create: true
  slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
  summary: '{{title}}'
  fields:
  - {label: Título, name: title, widget: string}
  - {label: Tags, name: tags, widget: list, required: false}
  - {label: Texto, name: body, widget: markdown}
